<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPDPA India Skill - banner</title>
<style>
  body{margin:0;background:#eef2f2;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;padding:24px}
  .wrap{max-width:900px;margin:0 auto}
  .cap{font-size:13px;color:#64748b;margin:2px 0 10px}
  .cap+.frame{margin-bottom:18px}
  .frame{width:100%;overflow:hidden;border-radius:14px}
  .banner{position:relative;width:1200px;height:420px;overflow:hidden;border-radius:14px;transform-origin:top left}
  .banner.dark{background:linear-gradient(135deg,#0f766e,#0d524c 55%,#082f2c);--ti:#fff;--ac:#5eead4;--eb:#99f6e4;--sub:#fff;--de:#ccfbf1;--cf:rgba(255,255,255,.10);--cs:rgba(94,234,212,.5);--ct:#fff;--co:#99f6e4}
  .banner.light{background:linear-gradient(135deg,#f0fdfa,#e3f7f4 50%,#f0fdfa);--ti:#0f172a;--ac:#0f766e;--eb:#0f766e;--sub:#0f172a;--de:#475569;--cf:rgba(15,118,110,.08);--cs:rgba(15,118,110,.35);--ct:#0f766e;--co:#0f766e}
  .glow{position:absolute;inset:0;background:radial-gradient(60% 80% at 78% 22%,rgba(45,212,191,.35),transparent 60%)}
  .banner.light .glow{background:radial-gradient(60% 80% at 78% 22%,rgba(45,212,191,.18),transparent 60%)}
  .wm{position:absolute;left:-28px;top:-154px;width:718px;height:718px;opacity:.06}
  .eyebrow{position:absolute;left:90px;top:40px;display:flex;align-items:center;gap:12px}
  .eyebrow span{color:var(--eb);font-size:15px;font-weight:700;letter-spacing:3px}
  .title{position:absolute;left:88px;top:86px;font-size:64px;font-weight:800;letter-spacing:-1px;line-height:60px;display:flex;flex-direction:column}
  .title .t1{color:var(--ti)}.title .t2{color:var(--ac)}
  .flag{position:absolute;left:92px;top:224px;width:130px;height:6px;display:flex;border-radius:2px;overflow:hidden}
  .flag i{flex:1}.flag i:nth-child(1){background:#FF9933}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#138808}
  .sub{position:absolute;left:92px;top:246px;color:var(--sub);font-size:25px;font-weight:600}
  .desc{position:absolute;left:92px;top:285px;color:var(--de);font-size:16px}
  .chips{position:absolute;left:92px;top:322px;display:flex;gap:12px}
  .chips span{font-size:14px;font-weight:600;color:var(--ct);background:var(--cf);border:1px solid var(--cs);padding:8px 18px;border-radius:18px}
  .card{position:absolute;left:742px;top:112px;width:386px;height:200px;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .banner.light .card{border:1px solid #dbe7e5}
  .badge{position:absolute;right:26px;top:22px;background:#fee2e2;color:#b91c1c;font-size:13px;font-weight:700;padding:5px 12px;border-radius:14px}
  .ceyebrow{position:absolute;left:26px;top:30px;color:#0f766e;font-size:12px;font-weight:700;letter-spacing:1.5px}
  .ctitle{position:absolute;left:26px;top:56px;color:#0f172a;font-size:22px;font-weight:700}
  .cdiv{position:absolute;left:26px;right:26px;top:98px;height:1px;background:#e2e8f0}
  .cfig{position:absolute;left:26px;top:118px;color:#0f766e;font-size:30px;font-weight:800}
  .csub{position:absolute;left:26px;top:166px;color:#475569;font-size:15px}
  .cmono{position:absolute;right:26px;top:166px;color:#94a3b8;font-size:13px;font-family:ui-monospace,monospace}
  .corner{position:absolute;right:52px;bottom:14px;display:flex;align-items:center;gap:8px}
  .corner span{color:var(--co);font-size:16px;font-weight:700}
  .corner svg{height:20px;width:auto;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="cap">Dark</div>
  <div class="frame"><div class="banner dark" id="dark"></div></div>
  <div class="cap">Light</div>
  <div class="frame"><div class="banner light" id="light"></div></div>
</div>
<script>
const GW='<g transform="translate(71.92 334.50) scale(0.21927 -0.21927)"><path d="M423 -16Q346 -16 277.5 12Q209 40 156.5 90Q104 140 74.5 208.5Q45 277 45 358Q45 439 74.5 507.5Q104 576 156 626Q208 676 276.5 704Q345 732 423 732Q509 732 578 702Q647 672 696 619L603 528Q580 553 553 569.5Q526 586 494 595Q462 604 422 604Q373 604 329.5 586.5Q286 569 252.5 536.5Q219 504 200 459Q181 414 181 358Q181 302 200 257Q219 212 252.5 179.5Q286 147 330 129.5Q374 112 424 112Q474 112 513 126Q552 140 579.5 164Q607 188 623.5 217.5Q640 247 645 278L420 278L420 393L771 393Q774 383 776 363Q778 343 778 330L778 330L778 330L778 330Q778 251 751.5 187Q725 123 677.5 77.5Q630 32 565 8Q500 -16 423 -16Z"/></g><g transform="translate(224.97 334.50) scale(0.21927 -0.21927)"><path d="M206 0L16 716L166 716L264 314L276 239L284 239L300 314L426 716L559 716L682 314L698 241L706 241L718 314L815 716L965 716L780 0L635 0L513 432L497 509L489 509L473 432L345 0Z"/></g>';
function chakra(cx,cy,r,c){let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-width="${r*0.085}"/><circle cx="${cx}" cy="${cy}" r="${r*0.13}" fill="${c}"/>`;for(let i=0;i<24;i++){const a=i*15*Math.PI/180,h=r*0.13;s+=`<line x1="${cx+Math.cos(a)*h}" y1="${cy+Math.sin(a)*h}" x2="${cx+Math.cos(a)*r*0.9}" y2="${cy+Math.sin(a)*r*0.9}" stroke="${c}" stroke-width="${r*0.028}" stroke-linecap="round"/>`}return s}
function shield(cx,cy,w,h){const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,cr=w*0.13;return `M ${x0+cr} ${y0} L ${x1-cr} ${y0} Q ${x1} ${y0} ${x1} ${y0+cr} L ${x1} ${y0+h*0.5} C ${x1} ${y0+h*0.83} ${cx} ${y0+h} ${cx} ${y0+h} C ${cx} ${y0+h} ${x0} ${y0+h*0.83} ${x0} ${y0+h*0.5} L ${x0} ${y0+cr} Q ${x0} ${y0} ${x0+cr} ${y0} Z`}
function mark(sz,sf,c){const cx=sz/2,cy=sz/2,w=sz*0.84,h=sz;return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><path d="${shield(cx,cy,w,h)}" fill="${sf}" stroke="${c}" stroke-width="${sz*0.05}" stroke-linejoin="round"/>${chakra(cx,cy-h*0.03,sz*0.29,c)}</svg>`}
const TH={dark:{wm:'#fff',mf:'rgba(45,212,191,.16)',eb:'#99f6e4',co:'#99f6e4'},light:{wm:'#0f766e',mf:'rgba(15,118,110,.10)',eb:'#0f766e',co:'#0f766e'}};
function build(t){const c=TH[t];return `
  <div class="glow"></div>
  <svg class="wm" viewBox="0 0 512 512"><g fill="${c.wm}">${GW}</g></svg>
  <div class="eyebrow">${mark(32,c.mf,c.eb)}<span>INDIA LAW COMPLIANCE TOOL</span></div>
  <div class="title"><span class="t1">DPDPA</span><span class="t2">India Skill</span></div>
  <div class="flag"><i></i><i></i><i></i></div>
  <div class="sub">Audit your app for India's Digital Protection Laws.</div>
  <div class="desc">DPDP Act 2023 + Rules 2025 - checklist, code patterns, templates.</div>
  <div class="chips"><span>Audit checklist</span><span>Code patterns</span><span>Policy templates</span></div>
  <div class="card">
    <div class="badge">Critical</div>
    <div class="ceyebrow">DPDP AUDIT - FINDING</div>
    <div class="ctitle">Security safeguards</div>
    <div class="cdiv"></div>
    <div class="cfig">&#8377;250 crore</div>
    <div class="csub">Max penalty - Section 8(5)</div>
    <div class="cmono">#C1</div>
  </div>
  <div class="corner"><svg class="gw" viewBox="60 165 390 185"><g fill="${c.co}">${GW}</g></svg><span>Project by GattyWorks.com</span></div>`}
document.getElementById('dark').innerHTML=build('dark');
document.getElementById('light').innerHTML=build('light');
function fit(){document.querySelectorAll('.frame').forEach(f=>{const b=f.querySelector('.banner'),s=f.clientWidth/1200;b.style.transform='scale('+s+')';f.style.height=(420*s)+'px'})}
fit();window.addEventListener('resize',fit);
</script>
</body>
</html>
